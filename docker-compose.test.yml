services:
  meilisearch-test:
    image: getmeili/meilisearch:v1.11
    ports:
      - "7701:7700"
    environment:
      MEILI_MASTER_KEY: testkey
      MEILI_ENV: development
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-test:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    ports:
      - "9001:9000"
    environment:
      MINIO_ROOT_USER: chatadmin
      MINIO_ROOT_PASSWORD: changeme
    command: server /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq-test:
    image: rabbitmq:4.0-management-alpine
    ports:
      - "5673:5672"
    environment:
      RABBITMQ_DEFAULT_USER: chat
      RABBITMQ_DEFAULT_PASS: chat
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
