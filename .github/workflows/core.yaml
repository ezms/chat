name: core

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3) — leave blank to run tests only"
        required: false

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      scylladb:
        image: scylladb/scylla:6.2
        ports: ["9042:9042"]
        options: >-
          --health-cmd "cqlsh -e 'describe cluster'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.17"
          otp-version: "27"

      - name: Cache deps
        uses: actions/cache@v4
        with:
          path: core/deps
          key: ${{ runner.os }}-mix-${{ hashFiles('core/mix.lock') }}

      - name: Cache build
        uses: actions/cache@v4
        with:
          path: core/_build
          key: ${{ runner.os }}-build-${{ hashFiles('core/mix.lock') }}

      - name: Install dependencies
        working-directory: core
        run: mix deps.get

      - name: Check formatting
        working-directory: core
        run: mix format --check-formatted

      - name: Compile
        working-directory: core
        run: mix compile --warnings-as-errors

      - name: Test
        working-directory: core
        env:
          SCYLLADB_HOST: localhost
          REDIS_HOST: localhost
        run: mix test --exclude no_broker

  release:
    needs: test
    runs-on: ubuntu-latest
    if: inputs.version != ''
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ inputs.version }}
          git push origin v${{ inputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          generate_release_notes: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/chat-core:${{ inputs.version }}
            ghcr.io/${{ github.repository_owner }}/chat-core:latest
